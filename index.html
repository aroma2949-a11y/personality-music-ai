<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PERSONALITY × MUSIC AI</title>
<style>
:root{--bg:#0b0b0d;--card:#151519;--text:#f5f5f5;--muted:#9999a3;--line:#2b2b32}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#25252d,#0b0b0d 42%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}.app{max-width:920px;margin:auto;padding:28px 18px 80px}.hero{padding:55px 0 42px}.k{font-size:10px;letter-spacing:.22em;color:#aaa;font-weight:800}.hero h1{font-size:clamp(55px,13vw,115px);line-height:.83;letter-spacing:-.08em;margin:14px 0 22px}.lead{max-width:670px;color:var(--muted);line-height:1.8}.panel{background:#151519ee;border:1px solid var(--line);border-radius:23px;padding:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field label{display:block;font-size:10px;letter-spacing:.12em;color:#aaa;font-weight:800;margin-bottom:8px}.field select{width:100%;height:51px;background:#0e0e11;color:#fff;border:1px solid #383840;border-radius:11px;padding:0 12px;font-size:16px}.button{width:100%;height:54px;border:0;border-radius:11px;background:#fff;color:#111;font-weight:900;font-size:15px;margin-top:18px}.status{display:none;margin-top:14px;color:#bbb;font-size:12px;line-height:1.6;padding:12px;border:1px solid var(--line);border-radius:10px}.result{padding-top:50px}.result h2{font-size:38px;letter-spacing:-.05em;margin:8px 0}.profile{color:#888;font-size:12px}.note{color:#aaa;font-size:13px;line-height:1.8;margin:18px 0 25px}.songs{display:grid;gap:13px}.song{background:#151519;border:1px solid var(--line);border-radius:18px;padding:18px}.row{display:flex;gap:13px}.cover{width:76px;height:76px;border-radius:10px;object-fit:cover;background:#25252b}.rank{font-size:10px;color:#777}.song h3{margin:3px 0;font-size:21px}.artist{font-size:13px;color:#999}.reason{font-size:13px;color:#d0d0d4;line-height:1.75}.links{display:flex;gap:8px;flex-wrap:wrap}.links a{color:#fff;text-decoration:none;border:1px solid #3a3a43;border-radius:8px;padding:8px 10px;font-size:11px;font-weight:800}.error{color:#ff9999}@media(max-width:600px){.grid{grid-template-columns:1fr}.hero{padding-top:30px}}
</style>
</head>
<body>
<div class="app">
<section class="hero">
<div class="k">PERSONALITY × MUSIC / AI</div>
<h1>FIND<br>YOUR MUSIC.</h1>
<p class="lead">4つの入力をAIが読み取り、その場で音楽をキュレーション。固定された10曲から選ぶのではなく、AIが候補を考えて外部の音楽カタログで実在曲を確認します。</p>
</section>

<section class="panel">
<div class="grid">
<div class="field"><label>MBTI</label><select id="mbti"><option value="">選択してください</option>
<option>INTJ</option><option>INTP</option><option>ENTJ</option><option>ENTP</option><option>INFJ</option><option>INFP</option><option>ENFJ</option><option>ENFP</option><option>ISTJ</option><option>ISFJ</option><option>ESTJ</option><option>ESFJ</option><option>ISTP</option><option>ISFP</option><option>ESTP</option><option>ESFP</option></select></div>
<div class="field"><label>恋愛タイプ</label><select id="love"><option value="">選択してください</option>
<option>一途に愛する</option><option>追いかけたい</option><option>追われたい</option><option>甘えたい</option><option>尽くしたい</option><option>じっくり進めたい</option><option>自由な恋愛が好き</option><option>安心感を大切にする</option></select></div>
<div class="field"><label>性別</label><select id="gender"><option value="">選択してください</option><option>男性</option><option>女性</option><option>その他</option><option>回答しない</option></select></div>
<div class="field"><label>年代</label><select id="age"><option value="">選択してください</option><option>10代</option><option>20代</option><option>30代</option><option>40代</option><option>50代以上</option></select></div>
</div>
<button id="find" class="button">AIであなたの音楽を探す →</button>
<div id="status" class="status"></div>
</section>

<section class="result">
<div class="k">AI CURATED FOR YOU</div><h2>あなたの音楽</h2>
<div id="profile" class="profile"></div>
<div id="note" class="note"></div>
<div id="songs" class="songs"></div>
</section>
</div>

<script>
const $=id=>document.getElementById(id);
function status(t,error=false){$("status").style.display="block";$("status").textContent=t;$("status").className="status"+(error?" error":"");}
$("find").onclick=async()=>{
 const body={mbti:$("mbti").value,love:$("love").value,gender:$("gender").value,age:$("age").value};
 if(Object.values(body).some(v=>!v)){status("4項目すべて選択してください。",true);return}
 $("find").disabled=true;$("songs").innerHTML="";status("AIがあなたの条件から音楽を探しています…");
 try{
  const r=await fetch("/api/recommend",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  const d=await r.json();if(!r.ok)throw new Error(d.error||"取得に失敗しました");
  $("profile").textContent=`${body.mbti} / ${body.love} / ${body.gender} / ${body.age}`;
  $("note").textContent=`AIが候補を考え、外部音楽カタログで確認した ${d.recommendations.length} 曲です。`;
  $("songs").innerHTML=d.recommendations.map((s,i)=>{
   const q=encodeURIComponent(s.artist+" "+s.title);
   return `<article class="song"><div class="row">${s.artwork?`<img class="cover" src="${s.artwork}">`:"<div class=cover></div>"}<div><div class=rank>0${i+1}</div><h3>${s.title}</h3><div class=artist>${s.artist}</div></div></div><p class=reason>${s.reason||""}</p><div class=links><a href="${s.appleMusic}" target="_blank">Apple Music ↗</a><a href="https://www.youtube.com/results?search_query=${q}" target="_blank">YouTube ↗</a><a href="https://open.spotify.com/search/${q}" target="_blank">Spotify ↗</a></div></article>`
  }).join("");
  status("完了。AIが今回の入力から選曲しました。");
 }catch(e){status(e.message,true)}finally{$("find").disabled=false}
};
</script>
</body>
</html>
