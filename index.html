<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eaf3f4">

<title>YOUR SOUND — あなたを、音楽にすると。</title>
<meta name="description" content="性格・恋愛傾向・今の気持ちから、あなたに刺さる音楽を探すYOUR SOUND。">

<style>
@import url('https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap');

:root{
  --ink:#111315;
  --muted:#686d72;
  --paper:#edf5f6;
  --line:rgba(17,19,21,.18);

  --b1:#d7eef2;
  --b2:#e7e1f4;
  --b3:#f2dfe7;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  min-height:100vh;
  overflow-x:hidden;

  color:var(--ink);

  font-family:
    "Zen Kaku Gothic New",
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;

  background:#edf5f6;
}

body:before{
  content:"";

  position:fixed;
  inset:-25%;

  z-index:-2;

  background:
    radial-gradient(circle at 12% 10%,var(--b1),transparent 32%),
    radial-gradient(circle at 90% 20%,var(--b2),transparent 35%),
    radial-gradient(circle at 55% 90%,var(--b3),transparent 38%),
    #edf5f6;

  transition:background 1.4s ease;

  animation:
    ambient
    15s
    ease-in-out
    infinite
    alternate;
}

body:after{
  content:"";

  position:fixed;
  inset:0;

  pointer-events:none;

  z-index:-1;

  opacity:.16;

  background-image:
    repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,.025) 3px
    );
}

@keyframes ambient{
  from{
    transform:
      translate(-1%,0)
      scale(1.03);
  }

  to{
    transform:
      translate(2%,-2%)
      scale(1.08);
  }
}

button,
select,
input,
textarea{
  font:inherit;
}

button{
  color:inherit;
  -webkit-tap-highlight-color:transparent;
}

.app{
  width:min(1120px,100%);
  margin:auto;

  padding:
    18px
    18px
    110px;
}


/* ==============================
   HEADER
============================== */

header{
  display:flex;
  justify-content:space-between;
  align-items:center;

  min-height:55px;

  padding:
    8px
    1px
    14px;

  border-bottom:
    1px solid
    var(--ink);

  font-size:9px;
  font-weight:900;

  letter-spacing:.22em;

  animation:
    topIn
    .9s
    ease
    both;
}

.brand{
  font-size:12px;
}

.issue{
  opacity:.48;
}

@keyframes topIn{
  from{
    opacity:0;
    transform:translateY(-8px);
  }

  to{
    opacity:1;
    transform:none;
  }
}


/* ==============================
   HERO
============================== */

.hero{
  position:relative;

  min-height:650px;

  display:flex;
  flex-direction:column;
  justify-content:center;

  padding:
    90px
    5px
    100px;

  overflow:hidden;
}


/* 巨大なレコード / 円 */

.hero-disc{
  position:absolute;

  width:min(76vw,650px);
  aspect-ratio:1;

  left:50%;
  top:49%;

  transform:
    translate(-50%,-50%);

  border-radius:50%;

  border:
    1px solid
    rgba(17,19,21,.17);

  background:
    radial-gradient(
      circle at center,
      rgba(237,245,246,.94) 0 7%,
      rgba(17,19,21,.16) 7.2% 7.7%,
      transparent 8% 19%,
      rgba(17,19,21,.08) 19.3% 19.7%,
      transparent 20% 31%,
      rgba(17,19,21,.065) 31.3% 31.6%,
      transparent 32% 43%,
      rgba(17,19,21,.055) 43.3% 43.6%,
      transparent 44%
    ),
    radial-gradient(
      circle at 35% 28%,
      rgba(255,255,255,.9),
      rgba(188,218,224,.45) 35%,
      rgba(90,110,120,.12) 65%,
      rgba(255,255,255,.12)
    );

  box-shadow:
    inset 20px 20px 80px rgba(255,255,255,.55),
    inset -30px -25px 90px rgba(30,50,60,.08);

  animation:
    discFloat
    8s
    ease-in-out
    infinite
    alternate;
}

.hero-disc:after{
  content:"";

  position:absolute;

  width:13%;
  aspect-ratio:1;

  left:50%;
  top:50%;

  transform:
    translate(-50%,-50%);

  border-radius:50%;

  background:#edf5f6;

  border:
    1px solid
    rgba(17,19,21,.2);
}

@keyframes discFloat{
  from{
    transform:
      translate(-50%,-50%)
      rotate(-3deg)
      scale(.95);
  }

  to{
    transform:
      translate(-50%,-52%)
      rotate(4deg)
      scale(1);
  }
}


/* 左の縦文字 */

.vertical-copy{
  position:absolute;

  left:2px;
  top:105px;

  writing-mode:vertical-rl;

  font-size:8px;

  font-weight:700;

  letter-spacing:.28em;

  opacity:.48;

  animation:
    fadeUp
    1s
    .5s
    both;
}


/* 右の番号 */

.hero-number{
  position:absolute;

  right:3px;
  top:100px;

  text-align:right;

  font-size:8px;

  line-height:1.8;

  letter-spacing:.18em;

  opacity:.45;

  animation:
    fadeUp
    1s
    .65s
    both;
}


/* HEROタイトル */

.hero-title{
  position:relative;

  z-index:2;

  margin:0;

  display:flex;
  flex-direction:column;

  line-height:.88;

  letter-spacing:-.08em;
}

.hero-pre{
  align-self:flex-start;

  margin-left:7%;

  font-size:
    clamp(25px,5vw,46px);

  font-weight:500;

  opacity:0;

  animation:
    copyIn
    .9s
    .15s
    cubic-bezier(.16,1,.3,1)
    forwards;
}

.hero-music{
  align-self:center;

  position:relative;

  margin:0;

  font-size:
    clamp(100px,25vw,230px);

  line-height:.78;

  font-weight:900;

  letter-spacing:-.13em;

  color:var(--ink);

  opacity:0;

  transform:
    translateY(55px)
    scaleX(.82)
    scaleY(1.15);

  animation:
    musicIn
    1.15s
    .35s
    cubic-bezier(.16,1,.3,1)
    forwards;
}

.hero-music:before{
  content:"MUSIC";

  position:absolute;

  left:4%;
  top:-8px;

  font-size:7px;

  font-weight:900;

  letter-spacing:.28em;

  opacity:.35;
}

.hero-post{
  align-self:flex-end;

  margin:
    14px
    8%
    0
    0;

  font-size:
    clamp(29px,7vw,62px);

  font-weight:500;

  opacity:0;

  animation:
    copyIn
    .9s
    .7s
    cubic-bezier(.16,1,.3,1)
    forwards;
}

@keyframes copyIn{
  from{
    opacity:0;
    transform:translateY(20px);
  }

  to{
    opacity:1;
    transform:none;
  }
}

@keyframes musicIn{
  0%{
    opacity:0;

    transform:
      translateY(55px)
      scaleX(.82)
      scaleY(1.15);

    filter:blur(10px);
  }

  100%{
    opacity:1;

    transform:none;

    filter:none;
  }
}


/* HERO説明 */

.hero-description{
  position:absolute;

  right:2px;
  bottom:45px;

  width:min(300px,67vw);

  padding-top:12px;

  border-top:
    1px solid
    var(--ink);

  font-size:11px;

  line-height:1.9;

  opacity:0;

  animation:
    fadeUp
    .9s
    1s
    forwards;
}

.hero-description:before{
  content:"ABOUT / YOUR SOUND";

  display:block;

  margin-bottom:7px;

  font-size:7px;

  font-weight:900;

  letter-spacing:.2em;

  opacity:.45;
}

@keyframes fadeUp{
  from{
    opacity:0;
    transform:translateY(12px);
  }

  to{
    opacity:1;
    transform:none;
  }
}


/* ==============================
   MODE SELECT
============================== */

.modes{
  display:grid;

  grid-template-columns:
    1fr
    1fr;

  border-top:
    1px solid
    var(--ink);

  border-bottom:
    1px solid
    var(--ink);

  margin-top:25px;
}

.mode{
  position:relative;

  min-height:135px;

  padding:
    22px
    20px;

  border:0;

  border-right:
    1px solid
    var(--line);

  border-radius:0;

  background:transparent;

  text-align:left;

  transition:
    background .35s,
    color .35s;
}

.mode:last-child{
  border-right:0;
}

.mode b{
  display:block;

  margin:
    18px
    0
    6px;

  font-size:20px;

  letter-spacing:-.05em;
}

.mode span{
  display:block;

  font-size:10px;

  color:var(--muted);

  line-height:1.6;
}

.mode.active{
  color:white;

  background:var(--ink);
}

.mode.active span{
  color:
    rgba(255,255,255,.6);
}


/* ==============================
   PANELS
============================== */

.panel{
  margin-top:50px;

  padding:
    32px
    0
    10px;

  border-top:
    1px solid
    var(--ink);
}

.hidden{
  display:none!important;
}

.head{
  display:flex;

  justify-content:space-between;
  align-items:flex-end;

  gap:15px;

  margin-bottom:32px;
}

.head h2{
  margin:0;

  font-size:
    clamp(29px,5vw,48px);

  line-height:1;

  font-weight:700;

  letter-spacing:-.07em;
}

.head small{
  font-size:8px;

  letter-spacing:.2em;

  opacity:.5;
}


/* ==============================
   FORMS
============================== */

.grid{
  display:grid;

  grid-template-columns:
    1fr
    1fr;

  gap:
    25px
    30px;
}

.field.full{
  grid-column:
    1/-1;
}

.field{
  padding-top:9px;

  border-top:
    1px solid
    var(--line);
}

.field label{
  display:block;

  margin-bottom:9px;

  font-size:9px;

  font-weight:700;

  letter-spacing:.14em;

  opacity:.55;
}

.field select,
.field input,
.field textarea{
  width:100%;

  padding:
    12px
    2px;

  border:0;

  border-bottom:
    1px solid
    var(--ink);

  border-radius:0;

  outline:none;

  background:transparent;

  color:var(--ink);

  font-size:15px;
}

.field select{
  height:50px;
}

.field textarea{
  min-height:100px;

  resize:vertical;
}

.field select:focus,
.field input:focus,
.field textarea:focus{
  background:
    rgba(255,255,255,.25);
}


/* LOVE TYPE */

.seg{
  display:flex;

  margin-bottom:6px;

  border:
    1px solid
    var(--ink);
}

.seg button{
  flex:1;

  padding:9px;

  border:0;

  border-radius:0;

  background:transparent;

  font-size:10px;

  font-weight:700;
}

.seg button.active{
  color:white;

  background:var(--ink);
}


/* ==============================
   BUTTONS
============================== */

.primary{
  width:100%;

  min-height:67px;

  margin-top:36px;

  border:
    1px solid
    var(--ink);

  border-radius:0;

  background:var(--ink);

  color:white;

  font-size:12px;

  font-weight:900;

  letter-spacing:.1em;

  transition:
    background .25s,
    color .25s,
    transform .2s;
}

.primary:active{
  transform:scale(.99);

  background:transparent;

  color:var(--ink);
}

.status{
  display:none;

  margin-top:12px;

  padding:
    10px
    0;

  border-bottom:
    1px solid
    var(--line);

  color:var(--muted);

  font-size:11px;
}

.error{
  color:#9d2845;
}

.manual-note{
  max-width:550px;

  margin:
    -12px
    0
    28px;

  font-size:11px;

  line-height:1.8;

  color:var(--muted);
}


/* ==============================
   LOADING
============================== */

.loading{
  position:fixed;

  inset:0;

  z-index:100;

  display:none;

  place-items:center;

  background:
    rgba(237,245,246,.82);

  backdrop-filter:
    blur(25px);

  -webkit-backdrop-filter:
    blur(25px);
}

.loading.show{
  display:grid;
}

.load{
  width:min(500px,85vw);

  text-align:center;
}

.orb{
  position:relative;

  width:130px;
  aspect-ratio:1;

  margin:auto;

  border-radius:50%;

  border:
    1px solid
    var(--ink);

  background:
    radial-gradient(
      circle,
      transparent 0 14%,
      rgba(17,19,21,.15) 14.5% 15%,
      transparent 15.5% 35%,
      rgba(17,19,21,.09) 35.5% 36%,
      transparent 36.5%
    );

  animation:
    loadingDisc
    2.4s
    linear
    infinite;
}

.orb:after{
  content:"";

  position:absolute;

  width:12px;
  height:12px;

  left:50%;
  top:50%;

  transform:
    translate(-50%,-50%);

  border-radius:50%;

  background:var(--ink);
}

@keyframes loadingDisc{
  to{
    transform:rotate(360deg);
  }
}

.load h2{
  margin-top:25px;

  font-size:22px;

  letter-spacing:-.05em;
}

.load p{
  font-size:11px;

  color:var(--muted);

  transition:opacity .25s;
}


/* ==============================
   RESULTS
============================== */

.results{
  display:none;

  margin-top:75px;

  padding-top:40px;

  border-top:
    1px solid
    var(--ink);
}

.results.enter{
  animation:
    resultIn
    .8s
    cubic-bezier(.16,1,.3,1)
    both;
}

@keyframes resultIn{
  from{
    opacity:0;
    transform:translateY(30px);
  }

  to{
    opacity:1;
    transform:none;
  }
}


/* MUSIC TYPE */

.type{
  position:relative;

  padding:
    10px
    0
    55px;
}

.type:after{
  content:"YOUR PROFILE";

  position:absolute;

  right:0;
  top:10px;

  writing-mode:vertical-rl;

  font-size:7px;

  font-weight:900;

  letter-spacing:.25em;

  opacity:.35;
}

.eyebrow{
  font-size:8px;

  font-weight:900;

  letter-spacing:.22em;

  opacity:.45;
}

.type h2{
  max-width:800px;

  margin:
    14px
    0
    22px;

  font-size:
    clamp(42px,8vw,82px);

  line-height:.98;

  letter-spacing:-.08em;
}

.type p{
  max-width:620px;

  margin:0;

  padding-top:14px;

  border-top:
    1px solid
    var(--line);

  font-size:12px;

  line-height:1.9;

  color:var(--muted);
}


/* ==============================
   CAROUSEL
============================== */

.results > .head{
  margin-top:20px;

  padding-top:13px;

  border-top:
    1px solid
    var(--ink);
}

.carousel{
  display:flex;

  gap:28px;

  overflow-x:auto;

  scroll-snap-type:
    x mandatory;

  scrollbar-width:none;

  margin:
    0
    -18px;

  padding:
    30px
    calc(50% - 142px)
    45px;
}

.carousel::-webkit-scrollbar{
  display:none;
}

.card{
  flex:
    0
    0
    284px;

  position:relative;

  scroll-snap-align:center;

  opacity:.25;

  transform:
    scale(.82)
    rotate(-2deg);

  transition:
    opacity .55s,
    transform .55s
    cubic-bezier(.16,1,.3,1);
}

.card:nth-child(even){
  transform:
    scale(.82)
    rotate(2deg);
}

.card.active{
  opacity:1;

  transform:
    scale(1)
    rotate(0deg);
}

.art{
  display:block;

  width:100%;
  aspect-ratio:1;

  object-fit:cover;

  border-radius:50%;

  border:
    1px solid
    rgba(17,19,21,.25);

  background:#dde8e9;

  box-shadow:
    0
    25px
    60px
    rgba(20,35,40,.16);

  filter:
    saturate(.88);
}

.card.active .art{
  animation:
    coverFloat
    5s
    ease-in-out
    infinite
    alternate;
}

@keyframes coverFloat{
  from{
    transform:
      translateY(0)
      rotate(-1deg);
  }

  to{
    transform:
      translateY(-8px)
      rotate(2deg);
  }
}

.best{
  position:absolute;

  right:-4px;
  top:8px;

  z-index:3;

  padding:
    8px
    9px;

  background:var(--ink);

  color:white;

  font-size:7px;

  font-weight:900;

  letter-spacing:.13em;

  transform:rotate(5deg);
}

.card h3{
  margin:
    17px
    0
    3px;

  overflow:hidden;

  white-space:nowrap;

  text-overflow:ellipsis;

  font-size:21px;

  letter-spacing:-.055em;
}

.artist{
  font-size:10px;

  letter-spacing:.06em;

  color:var(--muted);
}

.dots{
  margin:
    -13px
    0
    30px;

  text-align:center;

  font-size:8px;

  letter-spacing:.35em;

  opacity:.55;
}


/* ==============================
   DETAIL
============================== */

.detail{
  padding:
    35px
    0;

  border-top:
    1px solid
    var(--ink);

  border-bottom:
    1px solid
    var(--ink);
}

.detail.animate{
  animation:
    detailIn
    .55s
    cubic-bezier(.16,1,.3,1);
}

@keyframes detailIn{
  from{
    opacity:.15;

    transform:
      translateY(14px);

    filter:blur(5px);
  }

  to{
    opacity:1;

    transform:none;

    filter:none;
  }
}

.detail-head{
  display:flex;

  justify-content:
    space-between;

  align-items:flex-start;

  gap:15px;
}

.detail h2{
  max-width:760px;

  margin:
    6px
    0;

  font-size:
    clamp(38px,7vw,72px);

  line-height:.96;

  letter-spacing:-.08em;
}

.heart{
  flex:
    0
    0
    47px;

  width:47px;
  height:47px;

  border:
    1px solid
    var(--ink);

  border-radius:50%;

  background:transparent;

  font-size:20px;
}

.info{
  display:grid;

  grid-template-columns:
    1fr
    1fr;

  gap:0;

  margin-top:35px;

  border-top:
    1px solid
    var(--line);
}

.box{
  padding:
    21px
    18px
    21px
    0;

  border-bottom:
    1px solid
    var(--line);
}

.box:nth-child(odd){
  border-right:
    1px solid
    var(--line);
}

.box:nth-child(even){
  padding-left:18px;
}

.box h4{
  margin:
    0
    0
    9px;

  font-size:10px;
}

.box p{
  margin:0;

  font-size:11px;

  line-height:1.85;

  color:var(--muted);
}


/* LINKS */

.links{
  display:flex;

  flex-wrap:wrap;

  gap:0;

  margin-top:25px;

  border:
    1px solid
    var(--ink);
}

.links a{
  flex:1;

  min-width:120px;

  padding:13px;

  border-right:
    1px solid
    var(--ink);

  color:var(--ink);

  text-align:center;

  text-decoration:none;

  font-size:9px;

  font-weight:900;

  letter-spacing:.08em;
}

.links a:last-child{
  border-right:0;
}

.links a:active{
  background:var(--ink);

  color:white;
}


/* ==============================
   BOTTOM ACTIONS
============================== */

.actions{
  display:grid;

  grid-template-columns:
    1fr
    1fr;

  margin-top:20px;

  border:
    1px solid
    var(--ink);
}

.secondary{
  min-height:50px;

  border:0;

  border-right:
    1px solid
    var(--ink);

  background:transparent;

  font-size:10px;

  font-weight:900;
}

.secondary:last-child{
  border-right:0;
}

.secondary:active{
  background:var(--ink);

  color:white;
}


/* ==============================
   MOBILE
============================== */

@media(max-width:650px){

  .app{
    padding:
      15px
      15px
      90px;
  }

  .hero{
    min-height:620px;

    padding-top:70px;
  }

  .hero-disc{
    width:92vw;
  }

  .hero-pre{
    margin-left:5%;
  }

  .hero-post{
    margin-right:5%;
  }

  .hero-music{
    font-size:
      clamp(100px,31vw,150px);
  }

  .vertical-copy{
    top:90px;
  }

  .hero-description{
    bottom:35px;
  }

  .grid,
  .info{
    grid-template-columns:
      1fr;
  }

  .field.full{
    grid-column:auto;
  }

  .box:nth-child(odd){
    border-right:0;
  }

  .box:nth-child(even){
    padding-left:0;
  }

  .head{
    align-items:flex-start;

<!-- =========================
     LOADING
========================= -->

<div
id="loading"
class="loading"
>

<div class="load">

<div class="orb"></div>

<h2>
あなたの音楽を探しています
</h2>

<p id="lt">
性格と今の気持ちを読み解いています…
</p>

</div>

</div>


<script>

const $=
x=>
document.getElementById(x);


let mode="auto";

let lm="simple";

let last=null;

let songs=[];

let idx=0;

let timer;


const msgs=[

"性格と今の気持ちを読み解いています…",

"あなたに重なる音楽を探しています…",

"実在する曲を確認しています…",

"刺さるポイントを分析しています…"

];


/* =========================
   MODE
========================= */


document
.querySelectorAll(".mode")
.forEach(b=>{

b.onclick=()=>{

mode=
b.dataset.mode;


document
.querySelectorAll(".mode")
.forEach(x=>

x.classList.toggle(
"active",
x===b
)

);


$("auto")
.classList
.toggle(
"hidden",
mode!="auto"
);


$("manual")
.classList
.toggle(
"hidden",
mode!="manual"
);

};

});


/* =========================
   LOVE TYPE
========================= */


document
.querySelectorAll(".ls")
.forEach(b=>{

b.onclick=()=>{

lm=
b.dataset.l;


document
.querySelectorAll(".ls")
.forEach(x=>

x.classList.toggle(
"active",
x===b
)

);


$("simple")
.classList
.toggle(
"hidden",
lm!="simple"
);


$("l16")
.classList
.toggle(
"hidden",
lm!="l16"
);

};

});


/* =========================
   STATUS
========================= */


function st(id,s,e=0){

let x=$(id);

x.style.display=
"block";

x.textContent=s;

x.className=
"status"+
(e?" error":"");

}


/* =========================
   LOADING
========================= */


function load(on){

if(on){

let i=0;

$("loading")
.classList
.add("show");


$("lt")
.textContent=
msgs[0];


timer=
setInterval(()=>{

i++;

const el=
$("lt");

el.style.opacity=
"0";

setTimeout(()=>{

el.textContent=
msgs[
i%msgs.length
];

el.style.opacity=
"1";

},200);

},1700);

}

else{

clearInterval(timer);

$("loading")
.classList
.remove("show");

}

}


/* =========================
   ESCAPE
========================= */


function esc(s=""){

return String(s)
.replace(

/[&<>"']/g,

m=>({

"&":"&amp;",

"<":"&lt;",

">":"&gt;",

'"':"&quot;",

"'":"&#039;"

}[m])

);

}


/* =========================
   AUTO
========================= */


$("find")
.onclick=()=>{

let p={

mode:"auto",

mbti:
$("mbti").value,

love:
lm=="simple"
?
$("simple").value
:
$("l16").value,

gender:
$("gender").value,

age:
$("age").value,

mood:
$("mood").value

};


if(

Object
.values(p)
.some(
(v,i)=>
i&&!v
)

){

return st(

"ast",

"すべて選んでください。",

1

);

}


go(
p,
"ast"
);

};


/* =========================
   MANUAL
========================= */


$("mfind")
.onclick=()=>{

let p={

mode:"manual",

mood:
$("mmood").value,

scene:
$("scene").value,

romance:
$("romance").value,

genre:
$("genre").value,

fame:
$("fame").value,

focus:
$("focus").value,

reference:
$("reference")
.value
.trim(),

freeText:
$("free")
.value
.trim()

};


if(

!Object
.values(p)
.slice(1)
.some(Boolean)

){

return st(

"mst",

"少なくとも1つ条件を入れてください。",

1

);

}


go(
p,
"mst"
);

};


/* =========================
   API
========================= */


async function go(p,sid){

last=p;

load(1);


try{

let r=

await fetch(

"/api/recommend",

{

method:
"POST",

headers:{

"Content-Type":
"application/json"

},

body:
JSON.stringify(p)

}

);


let d=
await r.json();


if(!r.ok){

throw Error(

d.error||
"取得に失敗しました"

);

}


if(
!d.recommendations?.length
){

throw Error(

"曲を確認できませんでした。もう一度試してください。"

);

}


songs=
d.recommendations;


$("type")
.textContent=

d.listenerType||
"今のあなたのための5曲";


$("desc")
.textContent=

d.listenerDescription||
"";


render();

pick(0);


const results=
$("results");


results.style.display=
"block";


results
.classList
.remove("enter");


void results.offsetWidth;


results
.classList
.add("enter");


setTimeout(()=>{

results.scrollIntoView({

behavior:
"smooth"

});

},120);


st(

sid,

"選曲が完成しました。"

);

}


catch(e){

st(

sid,

e.message,

1

);

}


finally{

load(0);

}

}


/* =========================
   CAROUSEL
========================= */


function render(){

$("carousel")
.innerHTML=

songs
.map((s,i)=>`

<article
class="card"
data-i="${i}"
>

${
s.artwork
?
`
<img
class="art"
src="${esc(s.artwork)}"
alt="${esc(s.title)}"
>
`
:
`
<div class="art"></div>
`
}

${
i==0
?
`
<span class="best">
YOUR BEST MATCH
</span>
`
:
""
}

<h3>
${esc(s.title)}
</h3>

<div class="artist">
${esc(s.artist)}
</div>

</article>

`)
.join("");


document
.querySelectorAll(".card")
.forEach(c=>{

c.onclick=()=>{

pick(
+c.dataset.i
);

c.scrollIntoView({

behavior:
"smooth",

inline:
"center",

block:
"nearest"

});

};

});


let q;


$("carousel")
.onscroll=()=>{

clearTimeout(q);


q=
setTimeout(()=>{

let c=
$("carousel");


let center=

c.scrollLeft+
c.clientWidth/2;


let b=0;

let d=1e9;


[...c.children]
.forEach((e,i)=>{

let x=

Math.abs(

e.offsetLeft+
e.offsetWidth/2-
center

);


if(x<d){

d=x;

b=i;

}

});


pick(b);

},90);

};

}


/* =========================
   FAVORITES
========================= */


function favs(){

try{

return JSON.parse(

localStorage
.getItem(
"ysFavs"
)
||
"{}"

);

}

catch{

return {};

}

}


function key(s){

return(

s.artist+
"__"+
s.title

)
.toLowerCase();

}


/* =========================
   SONG PICK
========================= */


function pick(i){

if(!songs[i])
return;


idx=i;


document
.querySelectorAll(".card")
.forEach(
(c,n)=>

c.classList.toggle(
"active",
n==i
)

);


let s=
songs[i];


let f=
favs();


let q=

encodeURIComponent(

s.artist+
" "+
s.title

);


$("dots")
.textContent=

songs
.map(

(_,n)=>

n==i
?
"●"
:
"○"

)
.join("  ");


const detail=
$("detail");


detail.innerHTML=`

<div class="detail-head">

<div>

<div class="eyebrow">

${
i
?
"CURATED SELECTION"
:
"YOUR BEST MATCH"
}

</div>

<h2>
${esc(s.title)}
</h2>

<div class="artist">
${esc(s.artist)}
</div>

</div>


<button
id="heart"
class="heart"
aria-label="お気に入り"
>

${
f[key(s)]
?
"♥"
:
"♡"
}

</button>

</div>


<div class="info">


<div class="box">

<h4>
01 / この曲について
</h4>

<p>
${esc(s.summary)}
</p>

</div>


<div class="box">

<h4>
02 / なぜあなたに合う？
</h4>

<p>
${esc(s.why)}
</p>

</div>


<div class="box">

<h4>
03 / 特に刺さるポイント
</h4>

<p>
${esc(s.lyricPoint)}
</p>

</div>


<div class="box">

<h4>
04 / ここを意識して聴いて
</h4>

<p>
${esc(s.listenPoint)}
</p>

</div>


</div>


<div class="links">

${
s.appleMusic
?
`
<a
href="${esc(s.appleMusic)}"
target="_blank"
rel="noopener"
>
APPLE MUSIC ↗
</a>
`
:
""
}


<a
href="https://www.youtube.com/results?search_query=${q}"
target="_blank"
rel="noopener"
>
YOUTUBE ↗
</a>


<a
href="https://open.spotify.com/search/${q}"
target="_blank"
rel="noopener"
>
SPOTIFY ↗
</a>


</div>

`;


detail
.classList
.remove("animate");


void detail.offsetWidth;


detail
.classList
.add("animate");


$("heart")
.onclick=()=>{

let x=
favs();


let k=
key(s);


if(x[k]){

delete x[k];

}

else{

x[k]={

title:
s.title,

artist:
s.artist,

artwork:
s.artwork

};

}


localStorage
.setItem(

"ysFavs",

JSON.stringify(x)

);


pick(i);

};


mood(
s.mood
);

}


/* =========================
   MOOD BACKGROUND
========================= */


function mood(m=""){

m=
String(m)
.toLowerCase();


let c=[

"#d7eef2",

"#e7e1f4",

"#f2dfe7"

];


/* ROCK */

if(
/rock|energy/.test(m)
){

c=[

"#e9a59b",

"#eec49a",

"#bcb6ce"

];

}


/* SAD */

else if(
/sad/.test(m)
){

c=[

"#aec4da",

"#c7bfd7",

"#dcc6d1"

];

}


/* NIGHT */

else if(
/night/.test(m)
){

c=[

"#7f94ac",

"#958ca8",

"#718292"

];

}


/* DARK */

else if(
/dark/.test(m)
){

c=[

"#727d85",

"#88818e",

"#68757a"

];

}


/* LOVE */

else if(
/love/.test(m)
){

c=[

"#efbfd0",

"#eed0ca",

"#d9c7e7"

];

}


/* HAPPY */

else if(
/happy/.test(m)
){

c=[

"#eccda5",

"#efe1bd",

"#eac4cd"

];

}


/* CHILL */

else if(
/chill/.test(m)
){

c=[

"#b8ded9",

"#c4dde2",

"#d5d4e4"

];

}


/* HOPE */

else if(
/hope/.test(m)
){

c=[

"#c4dfe8",

"#e9d9aa",

"#eee6cf"

];

}


[
"--b1",
"--b2",
"--b3"
]
.forEach(

(x,i)=>

document
.documentElement
.style
.setProperty(
x,
c[i]
)

);

}


/* =========================
   ACTIONS
========================= */


$("reroll")
.onclick=()=>{

if(last){

go(

{
...last,
reroll:true
},

mode=="auto"
?
"ast"
:
"mst"

);

}

};


$("change")
.onclick=()=>{

window.scrollTo({

top:0,

behavior:
"smooth"

});

};

</script>
