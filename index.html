<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e7f2ff">

<title>YOUR SOUND</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap');

:root{
  --ink:#182039;
  --muted:#69738e;
  --glass:#ffffff99;
  --accent:#727cff;

  --b1:#dff4ff;
  --b2:#e7e0ff;
  --b3:#ffe0ef;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  background:#edf5ff;
  min-height:100vh;
  overflow-x:hidden;
}

/* =========================
   BACKGROUND
========================= */

body:before{
  content:"";
  position:fixed;
  inset:-25%;
  z-index:-2;

  background:
    radial-gradient(circle at 15% 12%,var(--b1),transparent 35%),
    radial-gradient(circle at 88% 18%,var(--b2),transparent 38%),
    radial-gradient(circle at 50% 88%,var(--b3),transparent 42%),
    #eff7ff;

  transition:
    background 1.4s ease,
    filter 1.4s ease;

  animation:
    bgMove 13s ease-in-out infinite alternate;
}

body:after{
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  pointer-events:none;

  background:
    linear-gradient(
      120deg,
      rgba(255,255,255,.13),
      rgba(255,255,255,0),
      rgba(255,255,255,.12)
    );

  opacity:.65;
}

@keyframes bgMove{
  0%{
    transform:translate(-1%,0) scale(1.03) rotate(0deg);
  }
  50%{
    transform:translate(2%,-1%) scale(1.07) rotate(1deg);
  }
  100%{
    transform:translate(-1%,2%) scale(1.04) rotate(-1deg);
  }
}

/* =========================
   BASE
========================= */

button,
select,
input,
textarea{
  font:inherit;
}

button{
  -webkit-tap-highlight-color:transparent;
}

.app{
  max-width:960px;
  margin:auto;
  padding:20px 16px 90px;
}

.glass{
  background:var(--glass);
  border:1px solid #ffffffc9;
  box-shadow:0 22px 60px #4250791c;

  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);
}

/* =========================
   HEADER
========================= */

header{
  display:flex;
  justify-content:space-between;
  align-items:center;

  font-size:10px;
  font-weight:900;
  letter-spacing:.18em;

  padding:8px 2px;

  animation:headerIn 1s cubic-bezier(.2,.8,.2,1) both;
}

@keyframes headerIn{
  from{
    opacity:0;
    transform:translateY(-10px);
  }
  to{
    opacity:1;
    transform:none;
  }
}

/* =========================
   HERO
========================= */

.hero{
  text-align:center;
  padding:64px 8px 40px;
}

.eyebrow{
  font-size:10px;
  letter-spacing:.2em;
  font-weight:900;
  color:#76809b;
}

.hero .eyebrow{
  opacity:0;
  animation:fadeUp .8s .1s ease forwards;
}

/*
  タイトルを「文章」ではなく
  タイポグラフィとして見せる
*/

.hero-title{
  margin:18px auto 20px;
  line-height:.92;
  letter-spacing:-.065em;
  font-weight:900;

  display:flex;
  flex-direction:column;
  align-items:center;
}

.hero-small{
  display:block;
  font-size:clamp(28px,7vw,48px);
  font-weight:500;
  letter-spacing:-.055em;

  opacity:0;
  transform:translateY(22px);
  animation:titleIn .9s .25s cubic-bezier(.16,1,.3,1) forwards;
}

.hero-music{
  position:relative;
  display:inline-block;

  font-size:clamp(76px,21vw,150px);
  font-weight:900;
  line-height:.92;
  letter-spacing:-.09em;

  margin:2px 0 7px;

  color:transparent;

  background:
    linear-gradient(
      115deg,
      #17213c 0%,
      #3b4569 25%,
      #6d72a6 48%,
      #222c4d 70%,
      #111a34 100%
    );

  background-size:200% 200%;
  -webkit-background-clip:text;
  background-clip:text;

  opacity:0;
  transform:
    translateY(32px)
    scale(.94);

  animation:
    musicIn 1.15s .42s cubic-bezier(.16,1,.3,1) forwards,
    textTexture 9s 1.5s ease-in-out infinite alternate;
}

.hero-music:after{
  content:"";
  position:absolute;
  left:5%;
  right:5%;
  bottom:-4px;
  height:1px;

  background:linear-gradient(
    90deg,
    transparent,
    #737ea6,
    transparent
  );

  opacity:.35;
}

.hero-end{
  display:block;

  font-size:clamp(31px,8vw,54px);
  font-weight:700;
  letter-spacing:-.06em;

  opacity:0;
  transform:translateY(20px);

  animation:titleIn .9s .7s cubic-bezier(.16,1,.3,1) forwards;
}

@keyframes titleIn{
  to{
    opacity:1;
    transform:none;
  }
}

@keyframes musicIn{
  0%{
    opacity:0;
    transform:translateY(35px) scale(.92);
    filter:blur(10px);
  }

  65%{
    opacity:1;
    filter:blur(0);
  }

  100%{
    opacity:1;
    transform:none;
    filter:none;
  }
}

@keyframes textTexture{
  from{
    background-position:0% 50%;
  }

  to{
    background-position:100% 50%;
  }
}

.hero p{
  max-width:620px;
  margin:22px auto 0;

  color:var(--muted);
  line-height:1.9;
  font-size:13px;

  opacity:0;
  transform:translateY(15px);

  animation:fadeUp .9s .95s ease forwards;
}

@keyframes fadeUp{
  to{
    opacity:1;
    transform:none;
  }
}

/* =========================
   MODES
========================= */

.modes{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:13px;

  opacity:0;
  transform:translateY(20px);

  animation:fadeUp .9s 1.1s ease forwards;
}

.mode{
  border:0;
  border-radius:24px;
  padding:21px;
  text-align:left;

  color:var(--ink);
  cursor:pointer;

  transition:
    transform .35s cubic-bezier(.2,.8,.2,1),
    background .35s,
    box-shadow .35s;
}

.mode:active{
  transform:scale(.98);
}

.mode.active{
  background:#ffffffd1;
  transform:translateY(-2px);
}

.mode b{
  display:block;
  font-size:18px;
  margin:12px 0 5px;
}

.mode span{
  font-size:12px;
  color:var(--muted);
}

/* =========================
   PANELS
========================= */

.panel{
  border-radius:28px;
  padding:21px;
  margin-top:15px;
}

.head{
  display:flex;
  justify-content:space-between;
  align-items:end;
  margin-bottom:17px;
}

.head h2{
  margin:0;
  font-size:25px;
  letter-spacing:-.04em;
}

.head small{
  color:var(--muted);
  letter-spacing:.12em;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:13px;
}

.field.full{
  grid-column:1/-1;
}

.field label{
  display:block;

  font-size:11px;
  font-weight:850;
  color:#66718c;

  margin-bottom:7px;
}

.field select,
.field input,
.field textarea{
  width:100%;

  border:1px solid #7180a526;
  background:#ffffffad;
  color:var(--ink);

  border-radius:15px;
  padding:14px;
  outline:none;

  transition:
    border .25s,
    background .25s,
    transform .25s;
}

.field select:focus,
.field input:focus,
.field textarea:focus{
  border-color:#727cff66;
  background:#ffffffd8;
}

.field select{
  height:52px;
}

.field textarea{
  min-height:96px;
  resize:vertical;
}

.seg{
  display:flex;
  background:#ffffff75;
  padding:4px;
  border-radius:14px;
  margin-bottom:8px;
}

.seg button{
  flex:1;

  border:0;
  background:transparent;
  border-radius:11px;

  padding:9px;

  color:var(--muted);
  font-size:12px;
  font-weight:800;

  transition:.25s;
}

.seg button.active{
  background:white;
  color:var(--ink);
}

/* =========================
   PRIMARY BUTTON
========================= */

.primary{
  width:100%;
  border:0;
  border-radius:17px;

  padding:16px;
  margin-top:17px;

  background:
    linear-gradient(
      120deg,
      #707cff,
      #a873ff
    );

  color:white;
  font-weight:900;

  box-shadow:0 12px 28px #747cff3d;

  transition:
    transform .25s,
    box-shadow .25s;
}

.primary:active{
  transform:scale(.985);
  box-shadow:0 7px 18px #747cff35;
}

.hidden{
  display:none!important;
}

.status{
  display:none;
  margin-top:12px;
  padding:12px;

  border-radius:13px;

  background:#ffffff78;

  color:var(--muted);
  font-size:12px;
}

.error{
  color:#a52e55;
}

/* =========================
   LOADING
========================= */

.loading{
  position:fixed;
  inset:0;
  z-index:20;

  display:none;
  place-items:center;

  background:#edf6ffc7;

  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);
}

.loading.show{
  display:grid;
}

.load{
  text-align:center;
  padding:25px;
}

.orb{
  width:90px;
  height:90px;
  margin:auto;

  border-radius:50%;

  background:
    linear-gradient(
      135deg,
      #8fe7ff,
      #9b8bff,
      #ffb5da
    );

  background-size:200% 200%;

  box-shadow:
    0 0 50px #7777ff45,
    inset 0 0 30px #ffffff55;

  animation:
    orbPulse 1.6s ease-in-out infinite alternate,
    orbColor 5s linear infinite;
}

@keyframes orbPulse{
  to{
    transform:scale(1.12) rotate(20deg);
    border-radius:38% 62% 55% 45%;
  }
}

@keyframes orbColor{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

.load h2{
  margin-top:25px;
  letter-spacing:-.04em;

  animation:loadingText 1.8s ease-in-out infinite alternate;
}

@keyframes loadingText{
  from{opacity:.65}
  to{opacity:1}
}

.load p{
  color:var(--muted);
  font-size:13px;

  transition:opacity .3s;
}

/* =========================
   RESULTS
========================= */

.results{
  display:none;
  padding-top:34px;
}

.results.show-result{
  animation:resultEnter .8s cubic-bezier(.16,1,.3,1) both;
}

@keyframes resultEnter{
  from{
    opacity:0;
    transform:translateY(25px);
  }

  to{
    opacity:1;
    transform:none;
  }
}

.type,
.detail{
  border-radius:28px;
  padding:23px;
}

.type h2{
  font-size:30px;
  letter-spacing:-.04em;
  margin:7px 0;
}

.type p{
  color:var(--muted);
  line-height:1.75;
  font-size:13px;
}

/* =========================
   CAROUSEL
========================= */

.carousel{
  display:flex;
  gap:14px;

  overflow-x:auto;

  scroll-snap-type:x mandatory;

  padding:
    18px
    calc(50% - 132px)
    28px;

  margin:0 -16px;

  scrollbar-width:none;
}

.carousel::-webkit-scrollbar{
  display:none;
}

.card{
  flex:0 0 264px;

  scroll-snap-align:center;

  border-radius:28px;
  padding:12px;

  opacity:.45;

  transform:
    scale(.88)
    translateY(9px);

  transition:
    opacity .45s,
    transform .45s cubic-bezier(.16,1,.3,1),
    box-shadow .45s;
}

.card.active{
  opacity:1;

  transform:
    scale(1)
    translateY(0);
}

.art{
  width:100%;
  aspect-ratio:1;

  object-fit:cover;

  border-radius:21px;

  background:#e2e8ff;

  box-shadow:
    0 18px 35px #35406d2b;

  transition:
    transform .5s cubic-bezier(.16,1,.3,1),
    filter .5s;
}

.card.active .art{
  transform:scale(1.015);
}

.best{
  display:inline-block;

  margin-top:11px;
  padding:6px 9px;

  border-radius:999px;

  background:
    linear-gradient(
      120deg,
      #707cff,
      #a873ff
    );

  color:white;

  font-size:9px;
  font-weight:900;
  letter-spacing:.12em;
}

.card h3{
  font-size:19px;

  margin:9px 2px 2px;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;

  letter-spacing:-.03em;
}

.artist{
  color:var(--muted);
  font-size:12px;
}

.dots{
  text-align:center;
  color:#7d86a0;

  margin:-14px 0 18px;

  letter-spacing:.08em;
}

/* =========================
   DETAIL ANIMATION
========================= */

.detail.detail-change{
  animation:detailChange .55s cubic-bezier(.16,1,.3,1);
}

@keyframes detailChange{
  0%{
    opacity:.2;
    transform:translateY(12px);
    filter:blur(5px);
  }

  100%{
    opacity:1;
    transform:none;
    filter:none;
  }
}

.detail-head{
  display:flex;
  justify-content:space-between;
  gap:12px;
}

.detail h2{
  font-size:28px;
  margin:4px 0;

  letter-spacing:-.045em;
}

.heart{
  flex:0 0 45px;

  width:45px;
  height:45px;

  border:0;
  border-radius:50%;

  background:#ffffffb8;

  font-size:20px;

  transition:
    transform .2s,
    background .2s;
}

.heart:active{
  transform:scale(.88);
}

.info{
  display:grid;
  grid-template-columns:1fr 1fr;

  gap:11px;
  margin-top:18px;
}

.box{
  background:#ffffff70;

  border-radius:18px;
  padding:15px;
}

.box h4{
  margin:0 0 7px;
  font-size:12px;
}

.box p{
  margin:0;

  color:#5e6881;

  font-size:12px;
  line-height:1.7;
}

/* =========================
   LINKS
========================= */

.links{
  display:flex;
  gap:8px;
  flex-wrap:wrap;

  margin-top:15px;
}

.links a,
.secondary{
  border:1px solid #63709b21;

  background:#ffffffa8;
  color:var(--ink);

  text-decoration:none;

  border-radius:12px;

  padding:10px 12px;

  font-size:11px;
  font-weight:850;

  transition:
    transform .2s,
    background .2s;
}

.links a:active,
.secondary:active{
  transform:scale(.96);
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;

  gap:9px;
  margin-top:13px;
}

.secondary{
  text-align:center;
}

.manual-note{
  color:var(--muted);

  font-size:12px;
  line-height:1.7;
}

/* =========================
   MOBILE
========================= */

@media(max-width:650px){

  .modes,
  .grid,
  .info{
    grid-template-columns:1fr;
  }

  .field.full{
    grid-column:auto;
  }

  .hero{
    padding-top:52px;
  }

  .panel{
    padding:18px;
  }

  .hero-music{
    font-size:clamp(78px,25vw,125px);
  }
}

@media(prefers-reduced-motion:reduce){

  *,
  *:before,
  *:after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    scroll-behavior:auto!important;
  }
}

</style>
</head>

  maxlength="300"
  placeholder="例：深夜に一人で歩きながら昔好きだった人を思い出す。でも最後は少し前向きになれる曲。"
></textarea>

<button

>
この条件で音楽を探す ✦

</section>

>

<div class="type glass">

YOUR MUSIC TYPE
</div>

</div>

  class="head"
  style="margin-top:24px"
>

<h2>
Recommended for you
</h2>

<small>
SWIPE
</small>

</div>

  id="carousel"
  class="carousel"
></div>


<div
  id="dots"
  class="dots"
></div>

  id="detail"
  class="detail glass"
></article>

<button
  id="reroll"
  class="secondary"
>
↻ 別の5曲
</button>

>
条件を変える
</button>

</div>

</section>

</div>

  id="loading"
  class="loading"
>

<div class="load">

<div class="orb"></div>

<h2>
あなたの音楽を探しています
</h2>

<p id="lt">
性格と今の気持ちを読み解いています…
</p>

</div>

</div>


<script>

const $=x=>document.getElementById(x);

let mode="auto";
let lm="simple";
let last=null;
let songs=[];
let idx=0;
let timer;

const msgs=[
  "性格と今の気持ちを読み解いています…",
  "あなたに重なる音楽を探しています…",
  "実在する曲を確認しています…",
  "刺さるポイントを分析しています…"
];


/* =========================
   MODE
========================= */

document
.querySelectorAll(".mode")
.forEach(b=>{

  b.onclick=()=>{

    mode=b.dataset.mode;

    document
    .querySelectorAll(".mode")
    .forEach(x=>
      x.classList.toggle(
        "active",
        x===b
      )
    );

    $("auto")
    .classList
    .toggle(
      "hidden",
      mode!="auto"
    );

    $("manual")
    .classList
    .toggle(
      "hidden",
      mode!="manual"
    );

  };

});


/* =========================
   LOVE TYPE
========================= */

document
.querySelectorAll(".ls")
.forEach(b=>{

  b.onclick=()=>{

    lm=b.dataset.l;

    document
    .querySelectorAll(".ls")
    .forEach(x=>
      x.classList.toggle(
        "active",
        x===b
      )
    );

    $("simple")
    .classList
    .toggle(
      "hidden",
      lm!="simple"
    );

    $("l16")
    .classList
    .toggle(
      "hidden",
      lm!="l16"
    );

  };

});


/* =========================
   STATUS
========================= */

function st(id,s,e=0){

  let x=$(id);

  x.style.display="block";

  x.textContent=s;

  x.className=
    "status"+
    (e?" error":"");

}


/* =========================
   LOADING
========================= */

function load(on){

  if(on){

    let i=0;

    $("loading")
    .classList
    .add("show");

    $("lt").textContent=msgs[0];

    timer=setInterval(()=>{

      i++;

      const el=$("lt");

      el.style.opacity="0";

      setTimeout(()=>{

        el.textContent=
          msgs[i%msgs.length];

        el.style.opacity="1";

      },220);

    },1700);

  }else{

    clearInterval(timer);

    $("loading")
    .classList
    .remove("show");

  }

}


/* =========================
   ESCAPE
========================= */

function esc(s=""){

  return String(s)
  .replace(
    /[&<>"']/g,
    m=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[m])
  );

}


/* =========================
   AUTO
========================= */

$("find").onclick=()=>{

  let p={

    mode:"auto",

    mbti:
      $("mbti").value,

    love:
      lm=="simple"
      ?$("simple").value
      :$("l16").value,

    gender:
      $("gender").value,

    age:
      $("age").value,

    mood:
      $("mood").value

  };

  if(
    Object
    .values(p)
    .some(
      (v,i)=>
      i&&!v
    )
  ){

    return st(
      "ast",
      "すべて選んでください。",
      1
    );

  }

  go(p,"ast");

};


/* =========================
   MANUAL
========================= */

$("mfind").onclick=()=>{

  let p={

    mode:"manual",

    mood:
      $("mmood").value,

    scene:
      $("scene").value,

    romance:
      $("romance").value,

    genre:
      $("genre").value,

    fame:
      $("fame").value,

    focus:
      $("focus").value,

    reference:
      $("reference")
      .value
      .trim(),

    freeText:
      $("free")
      .value
      .trim()

  };

  if(
    !Object
    .values(p)
    .slice(1)
    .some(Boolean)
  ){

    return st(
      "mst",
      "少なくとも1つ条件を入れてください。",
      1
    );

  }

  go(p,"mst");

};


/* =========================
   REQUEST
========================= */

async function go(p,sid){

  last=p;

  load(1);

  try{

    let r=
      await fetch(
        "/api/recommend",
        {
          method:"POST",

          headers:{
            "Content-Type":
            "application/json"
          },

          body:
            JSON.stringify(p)
        }
      );

    let d=
      await r.json();

    if(!r.ok){

      throw Error(
        d.error||
        "取得に失敗しました"
      );

    }

    if(
      !d.recommendations?.length
    ){

      throw Error(
        "曲を確認できませんでした。もう一度試してください。"
      );

    }

    songs=
      d.recommendations;

    $("type")
    .textContent=
      d.listenerType||
      "今のあなたのための5曲";

    $("desc")
    .textContent=
      d.listenerDescription||
      "";

    render();

    pick(0);

    const results=
      $("results");

    results.style.display="block";

    results
    .classList
    .remove("show-result");

    void results.offsetWidth;

    results
    .classList
    .add("show-result");

    setTimeout(
      ()=>
      results.scrollIntoView({
        behavior:"smooth"
      }),
      100
    );

    st(
      sid,
      "選曲が完成しました。"
    );

  }

  catch(e){

    st(
      sid,
      e.message,
      1
    );

  }

  finally{

    load(0);

  }

}


/* =========================
   CARDS
========================= */

function render(){

  $("carousel")
  .innerHTML=
    songs
    .map(
      (s,i)=>`

      <article
        class="card glass"
        data-i="${i}"
      >

      ${
        s.artwork
        ?`
        <img
          class="art"
          src="${esc(s.artwork)}"
          alt="${esc(s.title)}"
        >
        `
        :
        `<div class="art"></div>`
      }

      ${
        i==0
        ?`
        <span class="best">
        YOUR BEST MATCH
        </span>
        `
        :""
      }

      <h3>
      ${esc(s.title)}
      </h3>

      <div class="artist">
      ${esc(s.artist)}
      </div>

      </article>

      `
    )
    .join("");


  document
  .querySelectorAll(".card")
  .forEach(c=>{

    c.onclick=()=>{

      pick(
        +c.dataset.i
      );

      c.scrollIntoView({
        behavior:"smooth",
        inline:"center",
        block:"nearest"
      });

    };

  });


  let q;


  $("carousel")
  .onscroll=()=>{

    clearTimeout(q);

    q=setTimeout(()=>{

      let c=
        $("carousel");

      let center=
        c.scrollLeft+
        c.clientWidth/2;

      let b=0;

      let d=1e9;


      [...c.children]
      .forEach((e,i)=>{

        let x=
          Math.abs(
            e.offsetLeft+
            e.offsetWidth/2-
            center
          );

        if(x<d){

          d=x;
          b=i;

        }

      });

      pick(b);

    },90);

  };

}


/* =========================
   FAVORITES
========================= */

function favs(){

  try{

    return JSON.parse(
      localStorage
      .getItem("ysFavs")||
      "{}"
    );

  }

  catch{

    return {};

  }

}


function key(s){

  return(
    s.artist+
    "__"+
    s.title
  )
  .toLowerCase();

}


/* =========================
   PICK SONG
========================= */

function pick(i){

  if(!songs[i])return;

  idx=i;


  document
  .querySelectorAll(".card")
  .forEach(
    (c,n)=>
    c.classList.toggle(
      "active",
      n==i
    )
  );


  let s=songs[i];

  let f=favs();

  let q=
    encodeURIComponent(
      s.artist+
      " "+
      s.title
    );


  $("dots")
  .textContent=
    songs
    .map(
      (_,n)=>
      n==i
      ?"●"
      :"○"
    )
    .join("  ");


  const detail=
    $("detail");


  detail.innerHTML=`

  <div class="detail-head">

  <div>

  <div class="eyebrow">
  ${
    i
    ?"AI CURATED"
    :"YOUR BEST MATCH"
  }
  </div>

  <h2>
  ${esc(s.title)}
  </h2>

  <div class="artist">
  ${esc(s.artist)}
  </div>

  </div>


  <button
    id="heart"
    class="heart"
    aria-label="お気に入り"
  >
  ${
    f[key(s)]
    ?"♥"
    :"♡"
  }
  </button>

  </div>


  <div class="info">


  <div class="box">

  <h4>
  📖 この曲について
  </h4>

  <p>
  ${esc(s.summary)}
  </p>

  </div>


  <div class="box">

  <h4>
  💘 なぜあなたに合う？
  </h4>

  <p>
  ${esc(s.why)}
  </p>

  </div>


  <div class="box">

  <h4>
  🔥 特に刺さるポイント
  </h4>

  <p>
  ${esc(s.lyricPoint)}
  </p>

  </div>


  <div class="box">

  <h4>
  🎧 ここを意識して聴いて
  </h4>

  <p>
  ${esc(s.listenPoint)}
  </p>

  </div>


  </div>


  <div class="links">

  ${
    s.appleMusic
    ?`
    <a
      href="${esc(s.appleMusic)}"
      target="_blank"
      rel="noopener"
    >
    Apple Music ↗
    </a>
    `
    :""
  }

  <a
    href="https://www.youtube.com/results?search_query=${q}"
    target="_blank"
    rel="noopener"
  >
  YouTube ↗
  </a>

  <a
    href="https://open.spotify.com/search/${q}"
    target="_blank"
    rel="noopener"
  >
  Spotify ↗
  </a>

  </div>

  `;


  detail
  .classList
  .remove("detail-change");

  void detail.offsetWidth;

  detail
  .classList
  .add("detail-change");


  $("heart")
  .onclick=()=>{

    let x=favs();

    let k=key(s);

    if(x[k]){

      delete x[k];

    }else{

      x[k]={
        title:s.title,
        artist:s.artist,
        artwork:s.artwork
      };

    }

    localStorage
    .setItem(
      "ysFavs",
      JSON.stringify(x)
    );

    pick(i);

  };


  mood(s.mood);

}


/* =========================
   MUSIC MOOD BACKGROUND
========================= */

function mood(m=""){

  m=
    String(m)
    .toLowerCase();


  let c=[
    "#dff4ff",
    "#e7e0ff",
    "#ffe0ef"
  ];


  /*
    ROCK / ENERGY
    熱、ライブ、勢い
  */

  if(
    /rock|energy/.test(m)
  ){

    c=[
      "#ffb4a9",
      "#ffd19b",
      "#c8bfff"
    ];

  }


  /*
    SAD
    失恋・切なさ
  */

  else if(
    /sad/.test(m)
  ){

    c=[
      "#aac8ee",
      "#c9bce9",
      "#e9cadf"
    ];

  }


  /*
    NIGHT
    深夜
  */

  else if(
    /night/.test(m)
  ){

    c=[
      "#8395bd",
      "#a28fc3",
      "#7285ad"
    ];

  }


  /*
    DARK
    重い・内省
  */

  else if(
    /dark/.test(m)
  ){

    c=[
      "#76859e",
      "#9186aa",
      "#68788e"
    ];

  }


  /*
    LOVE
    恋
  */

  else if(
    /love/.test(m)
  ){

    c=[
      "#ffc2d8",
      "#ffd8d0",
      "#e6c8ff"
    ];

  }


  /*
    HAPPY
    明るい・幸福
  */

  else if(
    /happy/.test(m)
  ){

    c=[
      "#ffd8a5",
      "#ffebc6",
      "#ffcbd9"
    ];

  }


  /*
    CHILL
    水・空気・静けさ
  */

  else if(
    /chill/.test(m)
  ){

    c=[
      "#bcece3",
      "#c9e9ef",
      "#dedcf5"
    ];

  }


  /*
    HOPE
    朝・希望
  */

  else if(
    /hope/.test(m)
  ){

    c=[
      "#c9ebff",
      "#ffe8a9",
      "#fff5d8"
    ];

  }


  [
    "--b1",
    "--b2",
    "--b3"
  ]
  .forEach(
    (x,i)=>
    document
    .documentElement
    .style
    .setProperty(
      x,
      c[i]
    )
  );

}


/* =========================
   BUTTONS
========================= */

$("reroll")
.onclick=()=>{

  if(last){

    go(
      {
        ...last,
        reroll:true
      },
      mode=="auto"
      ?"ast"
      :"mst"
    );

  }

};


$("change")
.onclick=()=>{

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

};

</script>

</body>
</html>
