<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e7f2ff"><title>YOUR SOUND</title>
<style>
:root{--ink:#182039;--muted:#69738e;--glass:#ffffff99;--accent:#727cff;--b1:#dff4ff;--b2:#e7e0ff;--b3:#ffe0ef}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;background:#edf5ff;min-height:100vh}body:before{content:"";position:fixed;inset:-20%;z-index:-2;background:radial-gradient(circle at 20% 10%,var(--b1),transparent 35%),radial-gradient(circle at 85% 15%,var(--b2),transparent 35%),radial-gradient(circle at 50% 85%,var(--b3),transparent 38%),#eff7ff;transition:background 1s;animation:bg 12s ease-in-out infinite alternate}@keyframes bg{to{transform:translate(2%,-2%) scale(1.04)}}button,select,input,textarea{font:inherit}.app{max-width:960px;margin:auto;padding:20px 16px 90px}.glass{background:var(--glass);border:1px solid #ffffffc9;box-shadow:0 22px 60px #4250791c;backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}header{display:flex;justify-content:space-between;font-size:11px;font-weight:900;letter-spacing:.16em;padding:8px 2px}.hero{text-align:center;padding:60px 8px 34px}.eyebrow{font-size:10px;letter-spacing:.2em;font-weight:900;color:#76809b}.hero h1{font-size:clamp(44px,10vw,82px);line-height:.96;letter-spacing:-.065em;margin:14px 0}.hero p{max-width:620px;margin:auto;color:var(--muted);line-height:1.8;font-size:14px}.modes{display:grid;grid-template-columns:1fr 1fr;gap:13px}.mode{border:0;border-radius:24px;padding:21px;text-align:left;color:var(--ink);cursor:pointer}.mode.active{background:#ffffffd1;transform:translateY(-2px)}.mode b{display:block;font-size:18px;margin:12px 0 5px}.mode span{font-size:12px;color:var(--muted)}.panel{border-radius:28px;padding:21px;margin-top:15px}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:17px}.head h2{margin:0;font-size:25px}.head small{color:var(--muted);letter-spacing:.12em}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field.full{grid-column:1/-1}.field label{display:block;font-size:11px;font-weight:850;color:#66718c;margin-bottom:7px}.field select,.field input,.field textarea{width:100%;border:1px solid #7180a526;background:#ffffffad;color:var(--ink);border-radius:15px;padding:14px;outline:none}.field select{height:52px}.field textarea{min-height:96px;resize:vertical}.seg{display:flex;background:#ffffff75;padding:4px;border-radius:14px;margin-bottom:8px}.seg button{flex:1;border:0;background:transparent;border-radius:11px;padding:9px;color:var(--muted);font-size:12px;font-weight:800}.seg button.active{background:white;color:var(--ink)}.primary{width:100%;border:0;border-radius:17px;padding:16px;margin-top:17px;background:linear-gradient(120deg,#707cff,#a873ff);color:white;font-weight:900;box-shadow:0 12px 28px #747cff3d}.hidden{display:none!important}.status{display:none;margin-top:12px;padding:12px;border-radius:13px;background:#ffffff78;color:var(--muted);font-size:12px}.error{color:#a52e55}.loading{position:fixed;inset:0;z-index:20;display:none;place-items:center;background:#edf6ffc7;backdrop-filter:blur(25px)}.loading.show{display:grid}.load{text-align:center}.orb{width:90px;height:90px;margin:auto;border-radius:50%;background:linear-gradient(135deg,#8fe7ff,#9b8bff,#ffb5da);box-shadow:0 0 50px #7777ff45;animation:p 1.6s ease-in-out infinite alternate}@keyframes p{to{transform:scale(1.12) rotate(20deg);border-radius:38% 62% 55% 45%}}.load p{color:var(--muted);font-size:13px}.results{display:none;padding-top:34px}.type,.detail{border-radius:28px;padding:23px}.type h2{font-size:30px;letter-spacing:-.04em;margin:7px 0}.type p{color:var(--muted);line-height:1.75;font-size:13px}.carousel{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:18px calc(50% - 132px) 28px;margin:0 -16px;scrollbar-width:none}.carousel::-webkit-scrollbar{display:none}.card{flex:0 0 264px;scroll-snap-align:center;border-radius:28px;padding:12px;opacity:.65;transform:scale(.92);transition:.3s}.card.active{opacity:1;transform:scale(1)}.art{width:100%;aspect-ratio:1;object-fit:cover;border-radius:21px;background:#e2e8ff;box-shadow:0 18px 35px #35406d2b}.best{display:inline-block;margin-top:11px;padding:6px 9px;border-radius:999px;background:linear-gradient(120deg,#707cff,#a873ff);color:white;font-size:9px;font-weight:900;letter-spacing:.12em}.card h3{font-size:19px;margin:9px 2px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.artist{color:var(--muted);font-size:12px}.dots{text-align:center;color:#7d86a0;margin:-14px 0 18px}.detail-head{display:flex;justify-content:space-between}.detail h2{font-size:28px;margin:4px 0}.heart{width:45px;height:45px;border:0;border-radius:50%;background:#ffffffb8;font-size:20px}.info{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:18px}.box{background:#ffffff70;border-radius:18px;padding:15px}.box h4{margin:0 0 7px;font-size:12px}.box p{margin:0;color:#5e6881;font-size:12px;line-height:1.7}.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.links a,.secondary{border:1px solid #63709b21;background:#ffffffa8;color:var(--ink);text-decoration:none;border-radius:12px;padding:10px 12px;font-size:11px;font-weight:850}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px}.secondary{text-align:center}.manual-note{color:var(--muted);font-size:12px;line-height:1.7}@media(max-width:650px){.modes,.grid,.info{grid-template-columns:1fr}.field.full{grid-column:auto}.hero{padding-top:48px}.panel{padding:18px}}
</style></head><body><div class="app"><header><div>YOUR SOUND</div><div>AI MUSIC CURATOR</div></header><section class="hero"><div class="eyebrow">PERSONALITY × FEELING × MUSIC</div><h1>あなたを、<br>音楽にすると。</h1><p>AIが性格・恋愛傾向・今の気持ちから、実在する音楽の中に「今のあなたに刺さる曲」を探します。</p></section>
<div class="modes"><button class="mode glass active" data-mode="auto">🪄<b>おまかせ診断</b><span>性格や恋愛傾向からAIに任せる。</span></button><button class="mode glass" data-mode="manual">🎛️<b>マニュアル選曲</b><span>気分や場面まで細かく指定する。</span></button></div>
<section id="auto" class="panel glass"><div class="head"><h2>あなたについて</h2><small>QUICK DIAGNOSIS</small></div><div class="grid">
<div class="field"><label>MBTI</label><select id="mbti"><option value="">選択してください</option><option>INTJ</option><option>INTP</option><option>ENTJ</option><option>ENTP</option><option>INFJ</option><option>INFP</option><option>ENFJ</option><option>ENFP</option><option>ISTJ</option><option>ISFJ</option><option>ESTJ</option><option>ESFJ</option><option>ISTP</option><option>ISFP</option><option>ESTP</option><option>ESFP</option></select></div>
<div class="field"><label>恋愛タイプ</label><div class="seg"><button class="ls active" data-l="simple">かんたん</button><button class="ls" data-l="l16">LoveType16</button></div><select id="simple"><option value="">選択してください</option><option>一途に愛する</option><option>追いかけたい</option><option>追われたい</option><option>甘えたい</option><option>尽くしたい</option><option>じっくり進めたい</option><option>自由な恋愛が好き</option><option>安心感を大切にする</option></select><select id="l16" class="hidden"><option value="">LoveType16を選択</option><option>LCRO｜ボス猫</option><option>LCRE｜隠れベイビー</option><option>LCPO｜主役体質</option><option>LCPE｜ツンデレヤンキー</option><option>LARO｜憧れの先輩</option><option>LARE｜カリスマバランサー</option><option>LAPO｜パーフェクトカメレオン</option><option>LAPE｜キャプテンライオン</option><option>FCRO｜ロマンスマジシャン</option><option>FCRE｜ちゃっかりうさぎ</option><option>FCPO｜恋愛モンスター</option><option>FCPE｜忠犬ハチ公</option><option>FARO｜不思議生命体</option><option>FARE｜敏腕マネージャー</option><option>FAPO｜デビル天使</option><option>FAPE｜最後の恋人</option></select></div>
<div class="field"><label>性別</label><select id="gender"><option value="">選択してください</option><option>男性</option><option>女性</option><option>その他</option><option>回答しない</option></select></div><div class="field"><label>年代</label><select id="age"><option value="">選択してください</option><option>10代</option><option>20代</option><option>30代</option><option>40代</option><option>50代以上</option></select></div><div class="field full"><label>今の気分</label><select id="mood"><option value="">選択してください</option><option>特に指定なし</option><option>恋してる</option><option>幸せ</option><option>失恋した</option><option>切ない</option><option>一人で浸りたい</option><option>少ししんどい</option><option>無気力</option><option>テンションを上げたい</option><option>頑張りたい</option><option>深夜に聴きたい</option></select></div></div><button id="find" class="primary">私の音楽を探す ✦</button><div id="ast" class="status"></div></section>
<section id="manual" class="panel glass hidden"><div class="head"><h2>今、聴きたい音</h2><small>MANUAL</small></div><p class="manual-note">全部埋めなくてOK。入力した条件をAIが優先します。</p><div class="grid">
<div class="field"><label>気分</label><select id="mmood"><option value="">指定なし</option><option>幸せ</option><option>切ない</option><option>エモい</option><option>無気力</option><option>イライラ</option><option>ワクワク</option><option>前向きになりたい</option></select></div><div class="field"><label>シチュエーション</label><select id="scene"><option value="">指定なし</option><option>通学・通勤</option><option>ドライブ</option><option>深夜</option><option>勉強</option><option>筋トレ</option><option>デート</option><option>一人で散歩</option><option>寝る前</option></select></div><div class="field"><label>恋愛状況</label><select id="romance"><option value="">指定なし</option><option>片思い</option><option>両思い</option><option>失恋</option><option>復縁したい</option><option>忘れたい</option><option>曖昧な関係</option><option>恋愛以外</option></select></div><div class="field"><label>ジャンル</label><select id="genre"><option value="">指定なし</option><option>J-POP</option><option>ロック</option><option>HIPHOP</option><option>R&B</option><option>ボカロ</option><option>アニソン</option><option>K-POP</option><option>洋楽</option></select></div><div class="field"><label>知名度</label><select id="fame"><option value="">指定なし</option><option>有名曲中心</option><option>バランスよく</option><option>隠れた名曲も</option></select></div><div class="field"><label>重視</label><select id="focus"><option value="">指定なし</option><option>歌詞最優先</option><option>歌詞寄り</option><option>バランス</option><option>サウンド寄り</option><option>サウンド最優先</option></select></div><div class="field full"><label>参考曲</label><input id="reference" placeholder="例：HANABIの切なさとサビ"></div><div class="field full"><label>自由に伝える</label><textarea id="free" maxlength="300" placeholder="例：深夜に一人で歩きながら昔好きだった人を思い出す。でも最後は少し前向きになれる曲。"></textarea></div></div><button id="mfind" class="primary">この条件で音楽を探す ✦</button><div id="mst" class="status"></div></section>
<section id="results" class="results"><div class="type glass"><div class="eyebrow">YOUR MUSIC TYPE</div><h2 id="type"></h2><p id="desc"></p></div><div class="head" style="margin-top:24px"><h2>Recommended for you</h2><small>SWIPE</small></div><div id="carousel" class="carousel"></div><div id="dots" class="dots"></div><article id="detail" class="detail glass"></article><div class="actions"><button id="reroll" class="secondary">↻ 別の5曲</button><button id="change" class="secondary">条件を変える</button></div></section></div>
<div id="loading" class="loading"><div class="load"><div class="orb"></div><h2>あなたの音楽を探しています</h2><p id="lt">性格と今の気持ちを読み解いています…</p></div></div>
<script>
const $=x=>document.getElementById(x);let mode="auto",lm="simple",last=null,songs=[],idx=0,timer;const msgs=["性格と今の気持ちを読み解いています…","あなたに重なる音楽を探しています…","実在する曲を確認しています…","刺さるポイントを分析しています…"];
document.querySelectorAll(".mode").forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll(".mode").forEach(x=>x.classList.toggle("active",x===b));$("auto").classList.toggle("hidden",mode!="auto");$("manual").classList.toggle("hidden",mode!="manual")});document.querySelectorAll(".ls").forEach(b=>b.onclick=()=>{lm=b.dataset.l;document.querySelectorAll(".ls").forEach(x=>x.classList.toggle("active",x===b));$("simple").classList.toggle("hidden",lm!="simple");$("l16").classList.toggle("hidden",lm!="l16")});
function st(id,s,e=0){let x=$(id);x.style.display="block";x.textContent=s;x.className="status"+(e?" error":"")}function load(on){if(on){let i=0;$("loading").classList.add("show");timer=setInterval(()=>$("lt").textContent=msgs[++i%msgs.length],1700)}else{clearInterval(timer);$("loading").classList.remove("show")}}function esc(s=""){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
$("find").onclick=()=>{let p={mode:"auto",mbti:$("mbti").value,love:lm=="simple"?$("simple").value:$("l16").value,gender:$("gender").value,age:$("age").value,mood:$("mood").value};if(Object.values(p).some((v,i)=>i&& !v))return st("ast","すべて選んでください。",1);go(p,"ast")};$("mfind").onclick=()=>{let p={mode:"manual",mood:$("mmood").value,scene:$("scene").value,romance:$("romance").value,genre:$("genre").value,fame:$("fame").value,focus:$("focus").value,reference:$("reference").value.trim(),freeText:$("free").value.trim()};if(!Object.values(p).slice(1).some(Boolean))return st("mst","少なくとも1つ条件を入れてください。",1);go(p,"mst")};
async function go(p,sid){last=p;load(1);try{let r=await fetch("/api/recommend",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(p)}),d=await r.json();if(!r.ok)throw Error(d.error||"取得に失敗しました");if(!d.recommendations?.length)throw Error("曲を確認できませんでした。もう一度試してください。");songs=d.recommendations;$("type").textContent=d.listenerType||"今のあなたのための5曲";$("desc").textContent=d.listenerDescription||"";render();pick(0);$("results").style.display="block";setTimeout(()=>$("results").scrollIntoView({behavior:"smooth"}),100);st(sid,"選曲が完成しました。")}catch(e){st(sid,e.message,1)}finally{load(0)}}
function render(){$("carousel").innerHTML=songs.map((s,i)=>`<article class="card glass" data-i="${i}">${s.artwork?`<img class="art" src="${esc(s.artwork)}">`:`<div class="art"></div>`}${i==0?'<span class="best">YOUR BEST MATCH</span>':""}<h3>${esc(s.title)}</h3><div class="artist">${esc(s.artist)}</div></article>`).join("");document.querySelectorAll(".card").forEach(c=>c.onclick=()=>{pick(+c.dataset.i);c.scrollIntoView({behavior:"smooth",inline:"center",block:"nearest"})});let q;$("carousel").onscroll=()=>{clearTimeout(q);q=setTimeout(()=>{let c=$("carousel"),center=c.scrollLeft+c.clientWidth/2,b=0,d=1e9;[...c.children].forEach((e,i)=>{let x=Math.abs(e.offsetLeft+e.offsetWidth/2-center);if(x<d){d=x;b=i}});pick(b)},80)}}
function favs(){try{return JSON.parse(localStorage.getItem("ysFavs")||"{}")}catch{return{}}}function key(s){return(s.artist+"__"+s.title).toLowerCase()}function pick(i){idx=i;document.querySelectorAll(".card").forEach((c,n)=>c.classList.toggle("active",n==i));let s=songs[i],f=favs(),q=encodeURIComponent(s.artist+" "+s.title);$("dots").textContent=songs.map((_,n)=>n==i?"●":"○").join("  ");$("detail").innerHTML=`<div class="detail-head"><div><div class="eyebrow">${i?"AI CURATED":"YOUR BEST MATCH"}</div><h2>${esc(s.title)}</h2><div class="artist">${esc(s.artist)}</div></div><button id="heart" class="heart">${f[key(s)]?"♥":"♡"}</button></div><div class="info"><div class="box"><h4>📖 この曲について</h4><p>${esc(s.summary)}</p></div><div class="box"><h4>💘 なぜあなたに合う？</h4><p>${esc(s.why)}</p></div><div class="box"><h4>🔥 特に刺さるポイント</h4><p>${esc(s.lyricPoint)}</p></div><div class="box"><h4>🎧 ここを意識して聴いて</h4><p>${esc(s.listenPoint)}</p></div></div><div class="links">${s.appleMusic?`<a href="${esc(s.appleMusic)}" target="_blank">Apple Music ↗</a>`:""}<a href="https://www.youtube.com/results?search_query=${q}" target="_blank">YouTube ↗</a><a href="https://open.spotify.com/search/${q}" target="_blank">Spotify ↗</a></div>`;$("heart").onclick=()=>{let x=favs(),k=key(s);x[k]?delete x[k]:x[k]={title:s.title,artist:s.artist,artwork:s.artwork};localStorage.setItem("ysFavs",JSON.stringify(x));pick(i)};mood(s.mood)}
function mood(m=""){let c=["#dff4ff","#e7e0ff","#ffe0ef"];if(/rock|energy/.test(m))c=["#ffd7d7","#ffe0b9","#ddd8ff"];else if(/sad|dark|night/.test(m))c=["#cfddff","#d9d0ff","#dceaff"];else if(/happy|love/.test(m))c=["#ffe0eb","#ffe4c8","#e9ddff"];else if(/chill/.test(m))c=["#d6faf4","#dcefff","#e8e5ff"];else if(/hope/.test(m))c=["#def3ff","#fff0bd","#fff"];["--b1","--b2","--b3"].forEach((x,i)=>document.documentElement.style.setProperty(x,c[i]))}$("reroll").onclick=()=>last&&go({...last,reroll:true},mode=="auto"?"ast":"mst");$("change").onclick=()=>window.scrollTo({top:0,behavior:"smooth"});
</script></body></html>
